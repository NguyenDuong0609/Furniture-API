<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Test WebSocket — User</title>
  <style>
    * { box-sizing: border-box; font-family: monospace; }
    body { margin: 0; display: flex; height: 100vh; background: #1e1e2e; color: #cdd6f4; }
    .sidebar { width: 260px; background: #181825; padding: 16px; border-right: 1px solid #313244; display: flex; flex-direction: column; gap: 10px; }
    .main { flex: 1; display: flex; flex-direction: column; }
    h2 { margin: 0 0 8px; font-size: 14px; color: #89b4fa; text-transform: uppercase; letter-spacing: 1px; }
    input, textarea { width: 100%; padding: 7px 10px; background: #313244; border: 1px solid #45475a; border-radius: 6px; color: #cdd6f4; font-size: 13px; outline: none; }
    button { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-connect { background: #a6e3a1; color: #1e1e2e; }
    .btn-send { background: #89b4fa; color: #1e1e2e; }
    .btn-disconnect { background: #f38ba8; color: #1e1e2e; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .badge-on { background: #a6e3a1; color: #1e1e2e; }
    .badge-off { background: #f38ba8; color: #1e1e2e; }
    .log-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .log-item { padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; word-break: break-all; }
    .log-info  { background: #313244; border-left: 3px solid #89b4fa; }
    .log-ok    { background: #1e3a2e; border-left: 3px solid #a6e3a1; }
    .log-warn  { background: #3a2e1e; border-left: 3px solid #fab387; }
    .log-error { background: #3a1e1e; border-left: 3px solid #f38ba8; }
    .log-msg   { background: #2a2a3e; border-left: 3px solid #cba6f7; }
    .log-notif { background: #2e2a1e; border-left: 3px solid #f9e2af; }
    .chat-box { padding: 12px; border-top: 1px solid #313244; display: flex; gap: 8px; }
    .chat-box input { flex: 1; }
    .chat-box button { width: auto; padding: 7px 18px; }
    label { font-size: 12px; color: #6c7086; margin-bottom: 2px; display: block; }
    .status-bar { padding: 8px 16px; background: #181825; border-bottom: 1px solid #313244; font-size: 12px; display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>👤 User Client</h2>

  <div>
    <label>Server URL</label>
    <input id="serverUrl" value="http://localhost:3000/ws">
  </div>

  <div>
    <label>Access Token (JWT)</label>
    <textarea id="token" rows="4" placeholder="Paste accessToken..."></textarea>
  </div>

  <button class="btn-connect" onclick="connect()">⚡ Kết nối</button>
  <button class="btn-disconnect" onclick="disconnect()">✕ Ngắt kết nối</button>

  <hr style="border-color:#313244; margin: 4px 0">
  <h2>📩 Gửi tin nhắn</h2>

  <div>
    <label>Gửi đến Admin (toUserId — để trống nếu không cần)</label>
    <input id="toUserId" type="number" placeholder="userId của admin (không bắt buộc)">
  </div>

  <div>
    <label>Nội dung</label>
    <input id="msgContent" placeholder="Nhập tin nhắn...">
  </div>

  <button class="btn-send" onclick="sendMsg()">➤ Gửi</button>

  <hr style="border-color:#313244; margin: 4px 0">
  <h2>🔔 Thông tin</h2>
  <div style="font-size:12px;color:#6c7086;line-height:1.8">
    <div>→ Kết nối: namespace <b style="color:#cba6f7">/ws</b></div>
    <div>→ Auth: JWT qua <b style="color:#cba6f7">handshake.auth.token</b></div>
    <div>→ Nhận: <b style="color:#f9e2af">notification</b>, <b style="color:#cba6f7">newMessage</b></div>
    <div>→ Nhận: <b style="color:#a6e3a1">orderCreated</b>, <b style="color:#a6e3a1">orderPaid</b></div>
  </div>
</div>

<div class="main">
  <div class="status-bar">
    <span>Trạng thái:</span>
    <span id="statusBadge" class="badge badge-off">Chưa kết nối</span>
    <span id="socketId" style="color:#6c7086"></span>
  </div>

  <div class="log-area" id="logArea"></div>

  <div class="chat-box">
    <input id="quickMsg" placeholder="Nhắn nhanh..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="btn-send" onclick="sendMsg()">Gửi</button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  let socket = null;

  function log(text, type = 'info') {
    const area = document.getElementById('logArea');
    const div = document.createElement('div');
    div.className = `log-item log-${type}`;
    const time = new Date().toLocaleTimeString('vi-VN');
    div.textContent = `[${time}] ${text}`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function setStatus(on, id = '') {
    const badge = document.getElementById('statusBadge');
    badge.textContent = on ? 'Đã kết nối' : 'Chưa kết nối';
    badge.className = 'badge ' + (on ? 'badge-on' : 'badge-off');
    document.getElementById('socketId').textContent = id ? `socket: ${id}` : '';
  }

  function connect() {
    if (socket) socket.disconnect();
    const url = document.getElementById('serverUrl').value.trim();
    const token = document.getElementById('token').value.trim();
    if (!token) { log('⚠ Chưa nhập token!', 'warn'); return; }

    log(`Đang kết nối tới ${url} ...`, 'info');
    socket = io(url, { auth: { token } });

    socket.on('connect', () => {
      setStatus(true, socket.id);
      log(`✅ Kết nối thành công — socket.id: ${socket.id}`, 'ok');
    });

    socket.on('disconnect', (reason) => {
      setStatus(false);
      log(`❌ Ngắt kết nối: ${reason}`, 'error');
    });

    socket.on('connect_error', (err) => {
      setStatus(false);
      log(`⛔ Lỗi kết nối: ${err.message}`, 'error');
    });

    // Nhận thông báo hệ thống
    socket.on('notification', (data) => {
      log(`🔔 NOTIFICATION | type: ${data.type} | ${data.title}: ${data.message}`, 'notif');
      log(`   → data: ${JSON.stringify(data)}`, 'notif');
    });

    // Nhận tin nhắn chat
    socket.on('newMessage', (msg) => {
      const dir = msg.isAdmin ? '👨‍💼 Admin' : '👤 Bạn';
      log(`💬 newMessage từ ${dir}: ${msg.content}`, 'msg');
    });

    // Xác nhận tạo đơn
    socket.on('orderCreated', (d) => {
      log(`📦 orderCreated: ${JSON.stringify(d)}`, 'ok');
    });

    // Thanh toán thành công
    socket.on('orderPaid', (d) => {
      log(`💰 orderPaid: ${JSON.stringify(d)}`, 'ok');
    });

    // Ack từ sự kiện join
    socket.on('joined', (d) => log(`✔ joined: ${JSON.stringify(d)}`, 'ok'));
    socket.on('joinedAdmin', (d) => log(`✔ joinedAdmin: ${JSON.stringify(d)}`, 'ok'));
  }

  function disconnect() {
    if (socket) { socket.disconnect(); socket = null; }
  }

  function sendMsg() {
    if (!socket?.connected) { log('⚠ Chưa kết nối!', 'warn'); return; }
    const content = document.getElementById('quickMsg').value || document.getElementById('msgContent').value;
    if (!content.trim()) { log('⚠ Nội dung trống!', 'warn'); return; }
    const toUserId = parseInt(document.getElementById('toUserId').value) || undefined;
    socket.emit('sendMessage', { toUserId, content: content.trim() });
    document.getElementById('quickMsg').value = '';
    document.getElementById('msgContent').value = '';
    log(`➤ Đã gửi: "${content.trim()}" → toUserId: ${toUserId ?? '(broadcast to admins)'}`, 'info');
  }
</script>
</body>
</html>
