<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanh toán không thành công</title>
  <link rel="stylesheet" href="sepay-ui.css" />
</head>
<body>
  <div class="card">
    <div id="icon" class="icon err">✕</div>
    <h1 id="title">Thanh toán không thành công</h1>
    <p id="desc">Giao dịch gặp lỗi hoặc bị từ chối. Bạn có thể thử lại hoặc chọn phương thức khác.</p>
    <div id="meta" class="meta hidden"></div>
    <button id="retry" class="btn" disabled>Thanh toán lại</button>
  </div>

<script src="sepay-common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
(async () => {
  try {
    const s = await fetchStatus();
    $('meta').innerHTML = `<div><span>Mã đơn hàng</span><span>${s.orderCode}</span></div>`;
    $('meta').classList.remove('hidden');

    if (s.payment === 'PAID') {   // hiếm: IPN báo đã trả tiền dù redirect vào trang lỗi
      $('icon').className = 'icon ok'; $('icon').textContent = '✓';
      $('title').textContent = 'Thực ra thanh toán đã thành công';
      $('desc').textContent = 'Đơn hàng của bạn đã được ghi nhận, bạn không cần thanh toán lại.';
      $('retry').classList.add('hidden');
      return;
    }
    $('retry').disabled = false;
    $('retry').onclick = () => { $('retry').disabled = true; retryPayment(s.orderId); };
  } catch (e) {
    $('desc').textContent = 'Không lấy được thông tin giao dịch.';
  }
})();
</script>
</body>
</html>
